[project]
name = "unimarket-backend"
version = "0.1.0"
description = "UniMarket backend — Django REST API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.4,<5.0",
    "django-filter>=24.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "drf-spectacular>=0.27,<1.0",
    "channels>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",
    "celery>=5.4,<6.0",
    "redis>=5.1,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["config", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "config"]
addopts = "-ra --strict-markers"
