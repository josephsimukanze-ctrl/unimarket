
{% with product.variants.first as variant %}
<a href="{% url 'catalogue:product_detail' product.slug %}" class="group block">
  <div class="{% if compact %}aspect-square max-w-[80px]{% else %}aspect-square{% endif %} bg-ink-50 rounded-lg overflow-hidden relative">
    {% with product.images.first as img %}
      {% if img %}
        <img src="{{ img.image.url }}" alt="{{ product.name }}" class="h-full w-full object-cover transition duration-300 group-hover:scale-105">
      {% else %}
        <div class="h-full w-full flex items-center justify-center text-ink-400 text-xs">No image</div>
      {% endif %}
    {% endwith %}
  </div>
  <div class="mt-2">
    <p class="text-sm font-semibold text-ink-900">
      {% if variant %}{{ variant.currency }} {{ variant.price }}{% endif %}
    </p>
    <p class="text-xs text-ink-600 truncate mt-0.5">{{ product.name }}</p>
  </div>
</a>
{% endwith %}
