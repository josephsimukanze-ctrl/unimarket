<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; padding: 32px 0; margin: 0;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="max-width: 600px; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0;">
    <tr>
      <td style="background: linear-gradient(135deg, #f97316, #ea580c); padding: 32px; text-align: center;">
        <a href="{{ site_url|default:'http://localhost:8001' }}" style="color: white; font-size: 24px; font-weight: 700; text-decoration: none; letter-spacing: -0.5px;">UniMarket</a>
      </td>
    </tr>
    <tr>
      <td style="padding: 40px 32px;">
        <h1 style="margin: 0 0 16px; font-size: 22px; color: #0f172a; font-weight: 700;">{{ title }}</h1>
        {% if body %}
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #475569;">{{ body }}</p>
        {% endif %}
        {% if url %}
          <a href="{{ url }}" style="display: inline-block; background: #f97316; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px;">View on UniMarket →</a>
        {% endif %}
      </td>
    </tr>
    <tr>
      <td style="padding: 24px 32px; background: #f8fafc; border-top: 1px solid #e2e8f0; text-align: center;">
        <p style="margin: 0; font-size: 12px; color: #94a3b8;">
          You're receiving this because you have an account on UniMarket.<br>
          Everything you need. All in one place.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
