{% extends "base.html" %}
{% block title %}Delete product — UniMarket{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card p-8">
    <h1 class="text-xl font-bold text-ink-900 mb-2">Delete "{{ product.name }}"?</h1>
    <p class="text-sm text-ink-500 mb-6">This cannot be undone.</p>
    <form method="post" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Yes, delete</button>
      <a href="{% url 'catalogue:my_products' %}" class="btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
