{% extends "base.html" %}
{% block title %}Password updated — UniMarket{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card p-8 sm:p-10 text-center">
    <div class="mx-auto h-14 w-14 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-4">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-ink-900">Password updated</h1>
    <p class="text-sm text-ink-500 mt-2 mb-6">
      Your password has been reset. You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-primary">Log in</a>
  </div>
</div>
{% endblock %}
