{% extends "base.html" %}
{% block title %}Reset password — UniMarket{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card p-8 sm:p-10">
    <h1 class="text-2xl font-bold text-ink-900 tracking-tight">Reset your password</h1>
    <p class="text-sm text-ink-500 mt-1 mb-6">
      Enter the email address you registered with and we'll send you a reset link.
    </p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_email" class="label">Email address</label>
        <input type="email" name="email" id="id_email" required autofocus
               placeholder="you@example.com" class="input">
      </div>
      <button type="submit" class="btn-primary w-full">Send reset link</button>
    </form>

    <p class="mt-6 text-sm text-center text-ink-600">
      Remembered it? <a href="{% url 'accounts:login' %}" class="text-brand-600 font-medium hover:underline">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
