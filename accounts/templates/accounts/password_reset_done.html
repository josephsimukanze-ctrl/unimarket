{% extends "base.html" %}
{% block title %}Check your email — UniMarket{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="card p-8 sm:p-10 text-center">
    <div class="mx-auto h-14 w-14 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-4">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-ink-900">Check your inbox</h1>
    <p class="text-sm text-ink-500 mt-2 mb-6">
      If an account exists for that email, you'll receive a password reset link shortly. Check your spam folder if it doesn't arrive.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn-secondary">Back to login</a>
  </div>
</div>
{% endblock %}
