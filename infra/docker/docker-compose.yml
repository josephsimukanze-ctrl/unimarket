services:
  postgres:
    image: postgres:16-alpine
    container_name: unimarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unimarket_dev
      POSTGRES_USER: unimarket
      POSTGRES_PASSWORD: unimarket_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimarket -d unimarket_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unimarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
